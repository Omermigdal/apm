# Central reusable workflow: callers own the schedule and GitHub App credentials.
# Never run with pull_request_target or execute PR-supplied scripts with a write token.
name: Reusable APM consumer sync
on:
  workflow_call:
    inputs:
      apm-version:
        description: Pin of the APM CLI used to update and audit
        type: string
        required: false
        default: '0.35.0'
      app-client-id:
        description: Client ID of a GitHub App installed on the caller repository
        type: string
        required: true
    secrets:
      app-private-key:
        description: GitHub App private key for contents and pull-requests write
        required: true
permissions:
  contents: read
jobs:
  update:
    name: Update APM and open audited PR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout consumer (no stored credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Require a consumer manifest
        run: test -s apm.yml
      - name: Install pinned APM CLI
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: ${{ inputs.apm-version }}
          setup-only: true
      - name: Resolve and redeploy APM dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apm update Omermigdal/apm --yes
          apm audit --ci
      # Do not issue a write-capable token until untrusted package materialization
      # has completed. The App PR is a real event that triggers required CI.
      - name: Mint short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update APM sync pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/apm-sync
          delete-branch: true
          base: ${{ github.event.repository.default_branch }}
          commit-message: 'chore: synchronize first-party APM guidance'
          title: 'chore: sync APM guidance'
          body: |
            Automated refresh of the first-party Omermigdal/apm dependency and deployed agent guidance.
            The APM CLI audit completed before creating this PR.
            Review the changed agent text; require this PR's CI checks before merge.
          add-paths: |
            apm.yml
            apm.lock.yaml
            .github/instructions/
            .github/agents/
            .github/copilot-instructions.md
            .agents/skills/
            AGENTS.md
